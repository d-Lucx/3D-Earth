<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="32" cy="32" r="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f1d35" />
      <stop offset="100%" stop-color="#060911" />
    </radialGradient>
    <radialGradient id="oceanGrad" cx="24" cy="22" r="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="38%" stop-color="#0e5b88" />
      <stop offset="78%" stop-color="#0a284d" />
      <stop offset="100%" stop-color="#051226" />
    </radialGradient>
    <linearGradient id="orbitGrad" x1="6" y1="46" x2="58" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.9" />
    </linearGradient>
    <clipPath id="globeClip">
      <circle cx="32" cy="32" r="20" />
    </clipPath>
  </defs>

  <!-- Deep space tile background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGlow)" />

  <!-- Subtle outer Rayleigh atmosphere halo -->
  <circle cx="32" cy="32" r="22.5" stroke="#38bdf8" stroke-opacity="0.32" stroke-width="2" />

  <!-- Planet sphere -->
  <circle cx="32" cy="32" r="20" fill="url(#oceanGrad)" />

  <!-- Clipped continents, subtle meridian & terminator -->
  <g clip-path="url(#globeClip)">
    <!-- Americas-inspired landmass -->
    <path
      d="M17 17 C21 15 26 17 27 21 C28 24 25 27 24 30 C23 33 27 36 26 41 C25 46 21 49 18 48 C15 44 14 38 16 33 C14 28 13 21 17 17 Z"
      fill="#2dd4bf"
      fill-opacity="0.58"
    />
    <!-- Eurasia/Africa-inspired landmass -->
    <path
      d="M34 15 C41 14 49 18 51 24 C52 29 48 33 44 34 C46 38 45 45 40 48 C36 47 34 42 35 37 C32 34 31 28 33 24 C32 20 31 17 34 15 Z"
      fill="#34d399"
      fill-opacity="0.5"
    />
    <!-- Crisp equatorial & prime meridian telemetry lines -->
    <ellipse cx="32" cy="32" rx="20" ry="7.5" stroke="#bae6fd" stroke-opacity="0.22" stroke-width="0.9" />
    <ellipse cx="32" cy="32" rx="9" ry="20" stroke="#bae6fd" stroke-opacity="0.22" stroke-width="0.9" />
    <!-- Night-side terminator shading -->
    <path
      d="M37 11 A20 20 0 0 1 37 53 A15 20 0 0 0 37 11 Z"
      fill="#020617"
      fill-opacity="0.45"
    />
  </g>

  <!-- Crisp sunlit rim highlight -->
  <circle cx="32" cy="32" r="20" stroke="#7dd3fc" stroke-opacity="0.65" stroke-width="1.2" />

  <!-- Inclined orbital telemetry arc -->
  <ellipse
    cx="32"
    cy="32"
    rx="27"
    ry="9.5"
    transform="rotate(-24 32 32)"
    stroke="url(#orbitGrad)"
    stroke-width="1.8"
    stroke-dasharray="78 36"
    stroke-linecap="round"
  />

  <!-- Orbiting satellite node -->
  <circle cx="52.5" cy="22.8" r="2.8" fill="#e0f2fe" />
  <circle cx="52.5" cy="22.8" r="4.6" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.1" />
</svg>
